an{padding:0 10px}.bar4 .note-head{visibility:hidden}.notes-visible .bar4 .note-head{visibility:visible}

r(--line);border-radius:8px;padding:8px 12px;margin-bottom:8px;color:#435463}

ходный Excel" aria-label="Открыть исходный Excel">🖨</a><button class="head-button" id="installPwa" title="Установить для офлайн-доступа" aria-label="Установить приложение">PWA</button></div></div><section class="step"><h2>1. Участок</h2><div class="options"><button type="button" data-group="section" data-value="kor-vih">Коршуниха — Вихоревка</button><button type="button" data-group="section" data-value="vih-taishet">Вихоревка — Тайшет</button><button type="button" data-group="section" data-value="nizh-yurty">Нижнеудинск — Юрты</button><button type="button" data-group="section" data-value="yurty-nizh">Юрты — Нижнеудинск</button><button type="button" data-group="section" data-value="bratsk">Братский ход</button><button type="button" data-group="section" data-value="kor-ust">Коршуниха — Усть-Илим</button><button type="button" data-group="section" data-value="kor-lena">Коршуниха — Лена</button></div></section><section class="step"><h2>2. Номер пути</h2><div class="options"><button type="button" data-group="track" data-value="1">1 путь</button><button type="button" data-group="track" data-value="2">2 путь</button></div></section><section class="step"><h2>3. Тип поезда</h2><div class="options"><button class="cat-passenger" type="button" data-group="train" data-value="passenger">Пассажирские</button><button class="cat-freight" type="button" data-group="train" data-value="freight">Грузовые</button><button class="cat-empty" type="button" data-group="train" data-value="empty">Порожние</button><button class="cat-18-100" type="button" data-group="train" data-value="18-100">18-100</button></div></section><button class="go" id="go" disabled>Поехали</button><p class="hint">Выберите один вариант в каждом разделе.</p></main><script>const selected={section:'',track:'',train:''},go=document.getElementById('go');document.querySelectorAll('[data-group]').forEach(btn=>btn.onclick=()=>{const group=btn.dataset.group;document.querySelectorAll(`[data-group="${group}"]`).forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selected[group]=btn.dataset.value;go.disabled=!(selected.section&&selected.track&&selected.train)});go.onclick=()=>{location.href=`track-${selected.track}-${selected.train}.html?section=${encodeURIComponent(selected.section)}`};let installPrompt=null;const installButton=document.getElementById('installPwa');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;installButton.classList.add('install-ready')});installButton.onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;installButton.classList.remove('install-ready')}else if(/iphone|ipad|ipod/i.test(navigator.userAgent))alert('На iPhone: нажмите «Поделиться», затем «На экран Домой».');else alert('Откройте сайт по защищённой ссылке и выберите установку приложения в меню браузера.')};window.addEventListener('appinstalled',()=>installButton.hidden=true);</script><script>
if ('serviceWorker' in navigator) window.addEventListener('load',async()=>{
